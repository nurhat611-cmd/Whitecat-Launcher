name: Rust check (diagnostics)

on:
  push:
    branches:
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }
          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensisPath = Join-Path $nsisDirectory "makensis.exe"
          if (Test-Path $makensisPath) {
            $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare updater configuration (no signing keys in this job)
        shell: pwsh
        run: |
          $configPath = "src-tauri\tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.createUpdaterArtifacts = $false
          $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8

      - name: Build Windows app and NSIS installer
        id: build
        shell: pwsh
        continue-on-error: true
        run: |
          npm run tauri build -- --bundles nsis 2>&1 | Tee-Object -FilePath build.log
          exit $LASTEXITCODE

      - name: Report produced artifacts
        if: always()
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri\target\release" -Filter "*.exe" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length
          Get-ChildItem -Path "src-tauri\target\release\bundle\nsis" -ErrorAction SilentlyContinue |
            Select-Object FullName, Length

      - name: Publish diagnostics
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $log = Get-Content build.log -Raw -ErrorAction SilentlyContinue
          if ([string]::IsNullOrWhiteSpace($log)) {
            $log = "tauri build did not produce any output"
          }
          $max = 60000
          if ($log.Length -gt $max) {
            $log = "...(truncated)...`n" + $log.Substring($log.Length - $max)
          }
          $payload = @{
            name       = "windows build log"
            head_sha   = $env:GITHUB_SHA
            status     = "completed"
            conclusion = "neutral"
            output     = @{
              title   = "npm run tauri build -- --bundles nsis"
              summary = "Tail of the Windows release build log"
              text    = $log
            }
          } | ConvertTo-Json -Depth 6
          $payload | Out-File -FilePath payload.json -Encoding utf8
          gh api "repos/$env:GITHUB_REPOSITORY/check-runs" --method POST --input payload.json

      - name: Fail when the build fails
        if: steps.build.outcome == 'failure'
        shell: pwsh
        run: |
          Write-Host "Windows build failed - see the 'windows build log' check run."
          exit 1
