name: Build Windows artifacts

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis --yes --no-progress
          }

          $nsisDirectory = Join-Path ${env:ProgramFiles(x86)} "NSIS"
          $makensisPath = Join-Path $nsisDirectory "makensis.exe"

          if (Test-Path $makensisPath) {
            $nsisDirectory | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

          if (-not (Get-Command makensis -ErrorAction SilentlyContinue) -and -not (Test-Path $makensisPath)) {
            throw "Не найден makensis.exe после установки NSIS."
          }

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare updater configuration
        shell: pwsh
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $configPath = "src-tauri\tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          $hasSigningKeys = -not [string]::IsNullOrWhiteSpace($env:TAURI_UPDATER_PUBLIC_KEY) -and
            -not [string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)

          if ($hasSigningKeys) {
            node scripts/configure-updater.mjs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            "VITE_UPDATER_ENABLED=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Подпись updater включена для этой сборки."
          } else {
            $config.bundle.createUpdaterArtifacts = $false
            $config | ConvertTo-Json -Depth 100 | Set-Content -Path $configPath -Encoding utf8

            "VITE_UPDATER_ENABLED=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "Ключи updater не заданы: собираем обычные NSIS-артефакты без подписи автообновления."
          }

      - name: Build Windows app and NSIS installer
        uses: tauri-apps/tauri-action@v1
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --bundles nsis

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MyLauncher-Windows-${{ github.sha }}
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
          if-no-files-found: error
          retention-days: 30